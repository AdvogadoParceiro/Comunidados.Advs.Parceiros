<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunicados — Resolvvi</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f12;
      --surface:  #151820;
      --border:   #222530;
      --accent:   #ef3781;
      --accent2:  #ef3781;
      --text:     #fa206d;
      --muted:    #6b7280;
      --success:  #10b981;
      --error:    #ef4444;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(249, 52, 125, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(124,58,237,.12) 0%, transparent 60%);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 32px 80px rgba(0,0,0,.5);
      animation: fadeUp .5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .logo::before {
      content: '';
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
    }

   h1 {
  font-family: 'Syne', sans-serif;
  font-size: 1.75rem;
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: .5rem;
  background: linear-gradient(135deg, var(--text) 40%, var(--muted));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

    .subtitle {
      font-size: .875rem;
      color: var(--muted);
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    .field { margin-bottom: 1.5rem; }

    label {
      display: block;
      font-size: .8rem;
      font-weight: 500;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .5rem;
    }

    textarea, input[type="url"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      line-height: 1.6;
      transition: border-color .2s;
      outline: none;
    }
    textarea { resize: vertical; min-height: 140px; }
    textarea:focus, input[type="url"]:focus { border-color: var(--accent); }
    textarea::placeholder, input[type="url"]::placeholder { color: var(--muted); }

    /* seletor de público */
    .segs { display: flex; flex-wrap: wrap; gap: .5rem; }
    .seg {
      flex: 1; min-width: 110px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .85rem 1rem;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
    }
    .seg:hover { border-color: #3a3f4d; }
    .seg.on { border-color: var(--accent); background: rgba(239,55,129,.08); }
    .seg input { position: absolute; opacity: 0; pointer-events: none; }
    .seg .t { font-family: 'Syne', sans-serif; font-weight: 700; font-size: .95rem; color: var(--text); }
    .seg .d { font-size: .72rem; color: var(--muted); margin-top: .15rem; letter-spacing: .04em; }
    .seg.on .d { color: var(--accent); }

    .preview {
      font-size: .8rem;
      color: var(--muted);
      line-height: 1.6;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .85rem 1rem;
    }
    .preview b { color: var(--accent); font-weight: 600; }
    .preview .list { margin-top: .35rem; font-size: .74rem; }

    .btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .03em;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      margin-top: .5rem;
      position: relative;
      overflow: hidden;
    }

    .btn:hover { opacity: .9; }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .feedback {
      margin-top: 1.25rem;
      padding: .875rem 1rem;
      border-radius: 10px;
      font-size: .875rem;
      font-weight: 500;
      display: none;
      animation: fadeUp .3s ease both;
    }

    .feedback.success {
      background: rgba(16,185,129,.1);
      border: 1px solid rgba(16,185,129,.3);
      color: var(--success);
    }

    .feedback.error {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      color: var(--error);
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    .info {
      font-size: .78rem;
      color: var(--muted);
      line-height: 1.6;
      text-align: center;
    }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: .5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce){ *{ animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Resolvvi · Operações</div>
    <h1>Enviar Comunicado</h1>
    <p class="subtitle">Escreva o comunicado, escolha o público e dispare para os canais dos advogados parceiros no Discord.</p>

    <form id="form">
      <div class="field">
        <label>Mensagem *</label>
        <textarea id="mensagem" placeholder="Digite o comunicado aqui..." required></textarea>
      </div>

      <div class="field">
        <label>Link do material (opcional)</label>
        <input type="url" id="material" placeholder="Cole o link do vídeo/PDF (Google Drive, YouTube...)">
      </div>

      <div class="field">
        <label>Público</label>
        <div class="segs" id="segs">
          <label class="seg on" data-val="all"><input type="checkbox" checked><div class="t">Todos</div><div class="d">21 canais</div></label>
          <label class="seg" data-val="voos"><input type="checkbox"><div class="t">Voos</div><div class="d">voos</div></label>
          <label class="seg" data-val="nni"><input type="checkbox"><div class="t">NNI</div><div class="d">nni</div></label>
          <label class="seg" data-val="inss"><input type="checkbox"><div class="t">INSS</div><div class="d">inss</div></label>
        </div>
      </div>

      <div class="field">
        <div class="preview" id="preview"></div>
      </div>

      <button class="btn" type="submit" id="btn">Disparar Comunicado 🚀</button>

      <div class="feedback" id="feedback"></div>
    </form>

    <hr class="divider">
    <p class="info">Comunicado enviado pela equipe Resolvvi</p>
  </div>

  <script>
    // ─── Configuração ───────────────────────────────────────────
    // Produção (funciona com o workflow ATIVO). O antigo /webhook-test/ só
    // funcionava com o n8n aberto ouvindo evento de teste.
    const WEBHOOK_URL = 'https://n8n.resolvvi.com/webhook/comunicado-advogados';

    // canal -> produtos (mesmo mapeamento do workflow n8n)
    const CANAIS = [
      {n:'OA (Voos)',p:["voos"]},
      {n:'OA (NNI)',p:["inss", "nni"]},
      {n:'RBA (Voos)',p:["voos"]},
      {n:'RBA (NNI/INSS)',p:["inss", "nni"]},
      {n:'Frederico',p:["inss", "voos"]},
      {n:'Larissa',p:["voos"]},
      {n:'Gustavo',p:["voos"]},
      {n:'Diego',p:["voos"]},
      {n:'Leo Bessa',p:["voos"]},
      {n:'Amaral e Castro',p:["voos"]},
      {n:'Luis Eduardo',p:["voos"]},
      {n:'Lira Ventorini',p:["inss", "voos"]},
      {n:'Julia Jurdi',p:["voos"]},
      {n:'Malheiros',p:["voos"]},
      {n:'Hannah',p:["voos"]},
      {n:'Roberta',p:["inss", "voos"]},
      {n:'Luis Matheus',p:["voos"]},
      {n:'Lucas',p:["inss", "nni"]},
      {n:'Luciana',p:["inss", "nni"]},
      {n:'Marcilio',p:["inss"]},
      {n:'Igor Garrett',p:["inss"]}
    ];

    const segs = document.getElementById('segs');
    const preview = document.getElementById('preview');
    const btn = document.getElementById('btn');

    function selecao(){
      const on = [...segs.querySelectorAll('.seg')].filter(s=>s.classList.contains('on')).map(s=>s.dataset.val);
      if(on.includes('all')) return ['all'];
      return on;
    }
    function alvos(sel){
      if(sel.includes('all')) return CANAIS;
      return CANAIS.filter(c=>c.p.some(p=>sel.includes(p)));
    }
    function refresh(){
      const sel = selecao();
      if(sel.length===0){ preview.innerHTML='Selecione ao menos um público.'; btn.disabled=true; return; }
      btn.disabled=false;
      const list=alvos(sel);
      const label = sel.includes('all') ? 'Todos' : sel.map(s=>s.toUpperCase()).join(' + ');
      preview.innerHTML = `Vai para <b>${list.length} ${list.length===1?'canal':'canais'}</b> · ${label}`
        + `<div class="list">${list.map(c=>c.n).join(' · ')}</div>`;
      btn.textContent = sel.includes('all') ? 'Disparar para Todos 🚀' : `Disparar para ${label} 🚀`;
    }
    segs.addEventListener('click', e=>{
      const seg=e.target.closest('.seg'); if(!seg) return;
      e.preventDefault();
      const val=seg.dataset.val, cb=seg.querySelector('input');
      if(val==='all'){
        segs.querySelectorAll('.seg').forEach(s=>{s.classList.remove('on');s.querySelector('input').checked=false;});
        seg.classList.add('on'); cb.checked=true;
      }else{
        const all=segs.querySelector('[data-val=all]');
        all.classList.remove('on'); all.querySelector('input').checked=false;
        seg.classList.toggle('on'); cb.checked=seg.classList.contains('on');
        const anyProd=[...segs.querySelectorAll('.seg')].some(s=>s.dataset.val!=='all'&&s.classList.contains('on'));
        if(!anyProd){ all.classList.add('on'); all.querySelector('input').checked=true; }
      }
      refresh();
    });

    // ─── Submit ─────────────────────────────────────────────────
    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const mensagem = document.getElementById('mensagem').value.trim();
      const material = document.getElementById('material').value.trim();
      const sel = selecao();
      const feedback = document.getElementById('feedback');
      if (!mensagem || sel.length===0) return;

      const list = alvos(sel);
      const label = sel.includes('all') ? 'todos os canais' : sel.map(s=>s.toUpperCase()).join(' + ');
      if (!confirm(`Enviar para ${list.length} ${list.length===1?'canal':'canais'} (${label})?`)) return;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Enviando...';
      feedback.style.display = 'none';

      try {
        const payload = { mensagem, arquivo_url: material, produtos: sel };
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);

        feedback.className = 'feedback success';
        feedback.textContent = `✅ Comunicado enviado para ${list.length} ${list.length===1?'canal':'canais'}!`;
        feedback.style.display = 'block';
        document.getElementById('mensagem').value = '';
        document.getElementById('material').value = '';
      } catch (err) {
        feedback.className = 'feedback error';
        feedback.textContent = '❌ Erro ao enviar: ' + err.message + '. Verifique se o workflow está ATIVO no n8n.';
        feedback.style.display = 'block';
      }
      btn.disabled = false;
      refresh();
    });

    refresh();
  </script>
</body>
</html>
